<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sairaj Milk System - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- Secure Login Logo -->
        <div class="logo-container">
            <img src="login_img/secure-login.png"
                 alt="Secure Login"
                 class="secure-logo">
        </div>

        <!-- Heading -->
        <h1>Login</h1>
        <p class="subtitle">Please login to continue.</p>


        <form id="loginForm">

            <!-- Email -->
            <label for="email">Email Address</label>

            <div class="input-box">

                <img src="login_img/email_transparent.png"
                     alt="Email"
                     class="input-icon">

                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <label for="password">Password</label>

            <div class="input-box">

                <img src="login_img/lock_transparent.png"
                     alt="Password"
                     class="input-icon">

                <input type="password"
                       id="password"
                       placeholder="Enter your password"
                       required>

                <img src="login_img/eye_transparent.png"
                     alt="Show Password"
                     class="eye-icon"
                     id="togglePassword">

            </div>


            <!-- Remember Me + Forgot Password -->
            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <!-- Login Button -->
            <button type="submit" class="login-btn">
                <span>➜</span>
                Login
            </button>


            <!-- OR -->
            <div class="or-section">

                <div class="line"></div>

                <span>or</span>

                <div class="line"></div>

            </div>


            <!-- Google Login -->
            <button type="button" class="google-btn">

                <img src="login_img/google.jpg.jpeg"
                     alt="Google">

                <span>Login with Google</span>

            </button>


            <!-- Sign Up -->
            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </form>

    </div>


    <script src="login.js"></script>

</body>
</html>
