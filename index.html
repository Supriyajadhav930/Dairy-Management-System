<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sairaj Milk Collection Centre</title>


    <!-- Font Awesome Icons -->
    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Google Fonts -->
    <link 
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Your CSS -->
    <link rel="stylesheet" href="index.css">

</head>


<body>


    <!-- ================= HEADER / NAVBAR ================= -->

    <header class="header">

        <div class="header-container">


            <!-- LOGO -->

            <div class="logo-area">

                <img 
                    src="Images/logo.png"
                    alt="Sairaj Milk Collection Centre Logo"
                    class="main-logo"
                >

            </div>


            <!-- NAVIGATION -->

            <nav class="nav">


                <!-- HOME -->

                <a 
                    href="index.html"
                    class="nav-link active"
                >
                    Home
                </a>


                <!-- ABOUT -->

                <a 
                    href="about.html"
                    class="nav-link"
                >
                    About Us
                </a>


                <!-- CONTACT -->

                <a 
                    href="contact.html"
                    class="nav-link"
                >
                    Contact
                </a>

            </nav>


        </div>

    </header>



    <!-- ================= MAIN HERO SECTION ================= -->

    <main class="hero">


        <!-- RIGHT BACKGROUND IMAGE -->

        <div class="hero-bg-container">

            <img 
                src="Images/hero-bg.png"
                alt="Dairy Farm Background"
                class="hero-bg-image"
            >

        </div>



        <!-- LEFT OFF-WHITE CURVED PANEL -->

        <div class="curved-bg-panel"></div>



        <!-- HERO CONTENT -->

        <div class="hero-container">

            <div class="hero-text-content">


                <!-- TITLE -->

                <h1 class="hero-title">

                    Sairaj Milk
                    <br>

                    Collection Centre

                </h1>



                <!-- DIVIDER WITH MILK BOTTLE -->

                <div class="icon-divider">

                    <span class="line"></span>


                    <img 
                        src="Images/Bottle.png"
                        alt="Milk Bottle"
                        class="divider-icon"
                    >


                    <span class="line"></span>

                </div>



                <!-- DESCRIPTION -->

                <p class="hero-description">

                    We collect pure milk with care, maintain quality
                    with trust and deliver happiness every day.

                </p>



                <!-- ACTION BUTTONS -->

                <div class="cta-buttons">


                    <!-- LOGIN BUTTON -->

                    <a 
                        href="login.html"
                        class="btn btn-login"
                    >

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </a>



                    <!-- SIGN UP BUTTON -->

                    <a 
                        href="signup.html"
                        class="btn btn-signup"
                    >

                        <i class="fa-solid fa-user"></i>

                        Sign Up

                    </a>


                </div>


            </div>

        </div>



        <!-- ================= MILK SPLASH ================= -->

        <div class="milk-splash-container">

            <img 
                src="Images/Milk-Splash.png"
                alt="Milk Splash"
                class="milk-splash-img"
            >

        </div>



        <!-- ================= BOTTOM WAVE ================= -->

        <div class="bottom-wave-container">

            <img 
                src="Images/wave-bg.png"
                alt="Bottom Wave"
                class="wave-img"
            >

        </div>


    </main>



    <!-- ================= BOOTSTRAP JAVASCRIPT ================= -->

    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ================= YOUR JAVASCRIPT ================= -->

    <script src="index.js"></script>


</body>

</html>
