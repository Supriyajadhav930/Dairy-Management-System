<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sairaj Dairy Collection Centre</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <img src="Images/logo.png" alt="Sairaj Dairy Logo" class="main-logo">
            </div>
            <nav class="nav">
                <a href="#" class="nav-link active">Home</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero">
        
        <!-- Right Background Image (Cow & Farm Shed) -->
        <div class="hero-bg-container">
            <img src="Images/hero-bg.png" alt="Dairy Farm Background" class="hero-bg-image">
        </div>

        <!-- Left Off-White Organic Curved Panel -->
        <div class="curved-bg-panel"></div>

        <!-- Hero Content Area -->
        <div class="hero-container">
            <div class="hero-text-content">
                <h1 class="hero-title">
                    Sairaj Milk <br>Collection Centre
                </h1>

                <!-- Divider with Center Bottle Image -->
                <div class="icon-divider">
                    <span class="line"></span>
                    <img src="Images/Bottle.png" alt="Milk Bottle" class="divider-icon">
                    <span class="line"></span>
                </div>

                <p class="hero-description">
                    We collect pure milk with care, maintain quality with trust and deliver happiness every day.
                </p>

                <!-- Action Buttons -->
                <div class="cta-buttons">
                    <button class="btn btn-login">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                    <button class="btn btn-signup">
                        <i class="fa-solid fa-user"></i> Sign Up
                    </button>
                </div>
            </div>
        </div>

        <!-- Milk Splash Overlay (Bottom-Left) -->
        <div class="milk-splash-container">
            <img src="Images/Milk-Splash.png" alt="Milk Splash" class="milk-splash-img">
        </div>

        <!-- Bottom Wave Border -->
        <div class="bottom-wave-container">
            <img src="Images/wave-bg.png" alt="Bottom Wave" class="wave-img">
        </div>

    </main>

    <script src="index.js"></script>
</body>
</html>
